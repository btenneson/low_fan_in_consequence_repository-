name: Build machine-readable repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-repository.yml"
      - "scripts/build_from_source.py"
      - "scripts/validate_repository.py"
      - "scripts/export_graph.py"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build from original publication
        run: python scripts/build_from_source.py

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Export support hypergraph
        run: python scripts/export_graph.py

      - name: Commit generated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theorems.jsonl supports.jsonl provenance.jsonl repository.schema.json repository_hypergraph.dot
          if git diff --cached --quiet; then
            echo "Generated repository is already current."
          else
            git commit -m "Build machine-readable repository from source"
            git push
          fi
